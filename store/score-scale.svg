<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#04121f"/>
  <text x="50" y="60" fill="#e6f8ff" font-family="Arial" font-size="40">Чебурнет — шкала режимов (1.42)</text>
  <text x="50" y="100" fill="#96b4c3" font-family="Arial" font-size="20">Веса: мир 10 000 · Россия 100 · белый список 1 · Списки: мир 19, Россия 10, БС 10</text>

  <rect x="50" y="140" width="1100" height="110" rx="16" fill="#5a6069"/>
  <text x="75" y="180" fill="#0a141c" font-family="Arial" font-size="30">НЕТ СВЯЗИ</text>
  <text x="75" y="220" fill="#0a141c" font-family="Arial" font-size="26">S = 0</text>
  <text x="560" y="195" fill="#0a141c" font-family="Arial" font-size="22">ничего не ответило</text>

  <rect x="50" y="270" width="1100" height="110" rx="16" fill="#d69628"/>
  <text x="75" y="310" fill="#0a141c" font-family="Arial" font-size="30">БС / БЕЛЫЕ СПИСКИ</text>
  <text x="75" y="350" fill="#0a141c" font-family="Arial" font-size="26">1 – 510</text>
  <text x="560" y="325" fill="#0a141c" font-family="Arial" font-size="22">Россия ≤ 50% (0–5 из 10) + белый список</text>

  <rect x="50" y="400" width="1100" height="110" rx="16" fill="#ebebf0"/>
  <text x="75" y="440" fill="#0a141c" font-family="Arial" font-size="30">РФ / ЧЕБУРНЕТ</text>
  <text x="75" y="480" fill="#0a141c" font-family="Arial" font-size="26">600 – 1 010</text>
  <text x="560" y="455" fill="#0a141c" font-family="Arial" font-size="22">Россия &gt; 50% (6–10 из 10), мира нет</text>

  <rect x="50" y="530" width="1100" height="110" rx="16" fill="#46a0dc"/>
  <text x="75" y="570" fill="#0a141c" font-family="Arial" font-size="30">ЧАСТИЧНАЯ</text>
  <text x="75" y="610" fill="#0a141c" font-family="Arial" font-size="26">10 000 – 111 010</text>
  <text x="560" y="585" fill="#0a141c" font-family="Arial" font-size="22">мир 1–11 из 19 (≤ 60%)</text>

  <rect x="50" y="660" width="1100" height="110" rx="16" fill="#3cc882"/>
  <text x="75" y="700" fill="#0a141c" font-family="Arial" font-size="30">МИР / ЕСТЬ СВЯЗЬ</text>
  <text x="75" y="740" fill="#0a141c" font-family="Arial" font-size="26">120 000 – 191 010</text>
  <text x="560" y="715" fill="#0a141c" font-family="Arial" font-size="22">мир 12–19 из 19 (&gt; 60%)</text>

  <text x="50" y="820" fill="#c8e1f0" font-family="Arial" font-size="24">Пороги в процентах: БС ↔ РФ — 50% России · ЧАСТИЧНАЯ ↔ МИР — 60% мира</text>
  <text x="50" y="860" fill="#96b4c3" font-family="Arial" font-size="20">Промежутки 511–599 и 1 011–9 999 недостижимы</text>
</svg>
